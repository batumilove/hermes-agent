  - tests/test_hermes_ops_pull_budget_pin.py
  - tests/hermes_cli/test_update_lock_protocol.py
- id: feishu-webhook-authentication
  rationale: Preserve authenticated callback delivery while keeping invalid requests out of delivery quota
