version: 1
contracts:
- id: telegram-reply-context-and-anchor
  rationale: Preserve full resolved reply context and native partial quotes, keep private reply
    anchors through missing-thread retries, and retain the authored request during compaction.
  tests:
  - tests/gateway/test_reply_to_injection.py
  - tests/gateway/test_telegram_reply_quote.py
  - tests/gateway/test_telegram_thread_fallback.py
  - tests/gateway/test_queue_command.py
  - tests/agent/test_split_turn_compaction.py
- id: producer-generation-pythonpath-isolation
  rationale: Preserve exact producer-owned child-path filtering across dependency reselection and
    failed-activation lease cleanup without releasing earlier successful leases.
  tests:
  - tests/pm/test_producer_generation.py
  - tests/pm/test_lease_reselection.py
  - tests/pm/test_runtime_selection.py
  - tests/tools/test_build_subprocess_env.py
  - tests/tools/test_hermes_subprocess_env.py
- id: recovered-state-and-native-freshness
  rationale: Preserve routed test isolation, explicit DB pins, historical fork recovery layouts, ordered
    recovery obligations, native Relay freshness after compaction, and overlapping logical-call isolation.
  tests:
  - tests/hermes_state/test_default_db_profile_fixture.py
  - tests/hermes_cli/test_session_recovery_post_response.py
  - tests/hermes_cli/test_session_recovery_fork_layouts.py
  - tests/agent/test_relay_compaction_atof.py
  - tests/agent/test_relay_scope_isolation.py
  - tests/gateway/test_shutdown_completion_barrier.py
  - tests/tools/test_delegate_fallback_matrix.py
  - tests/tools/test_subagent_steer.py
  - tests/hermes_state/test_session_id_recognition_recovery.py
- id: verified-import-and-dependency-scan
  rationale: Preserve exact import provenance, later PR gates, complete registry dependency scans, and
    bounded JWT verification without breaking key rotation.
  tests:
  - tests/scripts/test_run_batumi_contracts.py
  - tests/scripts/test_fork_provenance_v2.py
  - tests/scripts/test_fork_check_base.py
  - tests/scripts/test_supply_chain_import_scan.py
