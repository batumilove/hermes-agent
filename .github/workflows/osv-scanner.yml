name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR/push (via the ci.yml orchestrator's workflow_call)
# and on a weekly schedule against main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions so we can
# decide when and how to patch on our own schedule. Our pinning strategy
# (full SHA / exact version) is preserved; only the notification signal
# is added.
#
# Complements the supply-chain-audit.yml workflow (which scans for malicious
# code patterns in PR diffs) by covering the orthogonal "currently-pinned
# dep became known-vulnerable" case.
#
# Uses Google's officially-recommended reusable workflow, pinned by SHA.
# Findings land in the repo's Security tab (Code Scanning > OSV-Scanner).
# fail-on-vuln remains disabled so OSV can report advisory findings without
# blocking deliberate patch scheduling; the npm-audit-high job below is the
# blocking gate for high/critical npm registry advisories.

on:
  workflow_call:
  schedule:
    # Weekly scan against main — catches CVEs published after merge for
    # deps that haven't changed since.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  # Required by the reusable workflow to upload SARIF to the Security tab.
  actions: read
  contents: read
  security-events: write

jobs:
  npm-lockfile-integrity:
    name: Validate npm lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Check npm lockfile resolved URLs and integrity hashes
        run: python3 scripts/validate_npm_lockfiles.py

  npm-audit-high:
    name: Block high npm advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Audit npm lockfiles for high/critical advisories
        env:
          # Force the public registry for audit metadata. Some cache registries
          # proxy tarballs but do not implement /-/npm/v1/security/audits/quick.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          for dir in . website plugins/platforms/photon/sidecar scripts/whatsapp-bridge; do
            echo "::group::npm audit ${dir}"
            (cd "$dir" && npm audit --package-lock-only --audit-level=high --omit=dev)
            echo "::endgroup::"
          done

  scan:
    name: Scan lockfiles
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      # Scan explicit lockfiles rather than recursing, so we only look at
      # the three sources of truth and skip vendored / test / worktree dirs.
      scan-args: |-
        --lockfile=uv.lock
        --lockfile=package-lock.json
        --lockfile=website/package-lock.json
        --lockfile=plugins/platforms/photon/sidecar/package-lock.json
        --lockfile=scripts/whatsapp-bridge/package-lock.json
      fail-on-vuln: false
