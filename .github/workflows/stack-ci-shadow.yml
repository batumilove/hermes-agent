name: Running stack CI shadow

# Measurement-only candidate for replacing broad compatibility axes while
# preserving the functional and governance gates applicable to each change.
# This workflow is intentionally not referenced by branch protection or CD.
on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stack-ci-shadow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.classify.outputs.python }}
      frontend: ${{ steps.classify.outputs.frontend }}
      site: ${{ steps.classify.outputs.site }}
      scan: ${{ steps.classify.outputs.scan }}
      deps: ${{ steps.classify.outputs.deps }}
      docker_meta: ${{ steps.classify.outputs.docker_meta }}
      mcp_catalog: ${{ steps.classify.outputs.mcp_catalog }}
      ci_review: ${{ steps.classify.outputs.ci_review }}
      event_name: ${{ github.event_name }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}

  policy:
    name: Policy and lock contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Check repository contracts
        run: |
          set -euo pipefail
          python3 scripts/check_agents_context.py
          uv lock --check
          uv run --locked --extra dev ruff check .
          python3 scripts/audit_github_workflows.py

  full-tests:
    name: Full Python 3.13 tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      slice_count: 8
      python_versions_json: '["3.13"]'
      e2e_python_version: "3.13"

  lint:
    name: Python lints
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}

  js-tests:
    name: JS & TS checks
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/js-tests.yml

  e2e-desktop:
    name: Desktop E2E
    needs: detect
    if: needs.detect.outputs.python == 'true' || needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/e2e-desktop.yml

  docs-site:
    name: Docs site
    needs: detect
    if: needs.detect.outputs.site == 'true'
    uses: ./.github/workflows/docs-site-checks.yml

  history-check:
    name: Deny unrelated histories
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request'
    uses: ./.github/workflows/history-check.yml

  contributor-check:
    name: Check contributors
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/contributor-check.yml

  uv-lockfile:
    name: Check uv.lock
    needs: detect
    uses: ./.github/workflows/uv-lockfile-check.yml

  docker-lint:
    name: Lint Docker scripts
    needs: detect
    if: needs.detect.outputs.docker_meta == 'true'
    uses: ./.github/workflows/docker-lint.yml

  supply-chain:
    name: Supply-chain scan
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.scan == 'true' || needs.detect.outputs.deps == 'true')
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}

  review-labels:
    name: Review label gate
    needs: [detect, supply-chain]
    if: always() && needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.ci_review == 'true' || needs.detect.outputs.mcp_catalog == 'true' || needs.supply-chain.outputs.critical_findings == 'true')
    uses: ./.github/workflows/review-labels.yml
    with:
      ci_review: ${{ needs.detect.outputs.ci_review == 'true' }}
      mcp_catalog: ${{ needs.detect.outputs.mcp_catalog == 'true' }}
      supply_chain: ${{ needs.supply-chain.outputs.critical_findings == 'true' }}
    permissions:
      contents: read
      pull-requests: read

  dependency-gates:
    name: Read-only dependency gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate npm lockfiles
        run: python3 scripts/validate_npm_lockfiles.py
      - name: Block high npm advisories
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          for dir in . website plugins/platforms/photon/sidecar scripts/whatsapp-bridge; do
            echo "::group::npm audit ${dir}"
            (cd "$dir" && npm audit --package-lock-only --audit-level=high --omit=dev)
            echo "::endgroup::"
          done

  runtime-tests:
    name: Running-stack contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.13 --extra dev --extra messaging
      - name: Run running-stack contract tests
        run: |
          scripts/run_tests.sh \
            tests/gateway/test_telegram_connect.py \
            tests/gateway/test_telegram_polling_progress.py \
            tests/gateway/test_webhook_integration.py \
            tests/gateway/test_systemd_watchdog_lifecycle.py \
            tests/cron/test_scheduler.py \
            tests/cron/test_cron_no_agent.py \
            tests/tools/test_gateway_cwd_contract.py \
            tests/plugins/test_provider_telemetry_plugin.py \
            tests/scripts/test_hermes_compose_deploy.py \
            tests/scripts/test_verify_running_stack.py \
            tests/scripts/test_stack_ci_shadow_workflow.py

  image:
    name: Deployed AMD64 image contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build exact deployed architecture
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: hermes-stack-shadow:${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hermes-deploy-amd64
      - name: Exercise image runtime contract
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            "hermes-stack-shadow:${GITHUB_SHA}" \
            -c 'import cron.scheduler; import gateway.run; import tools.registry'

  shadow:
    name: Stack integration shadow (non-required)
    needs:
      - detect
      - policy
      - full-tests
      - lint
      - js-tests
      - e2e-desktop
      - docs-site
      - history-check
      - contributor-check
      - uv-lockfile
      - docker-lint
      - supply-chain
      - review-labels
      - dependency-gates
      - runtime-tests
      - image
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate shadow lanes
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ needs.detect.outputs.event_name }}
          PYTHON_CHANGED: ${{ needs.detect.outputs.python }}
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
          SITE_CHANGED: ${{ needs.detect.outputs.site }}
          SCAN_CHANGED: ${{ needs.detect.outputs.scan }}
          DEPS_CHANGED: ${{ needs.detect.outputs.deps }}
          DOCKER_META_CHANGED: ${{ needs.detect.outputs.docker_meta }}
          CI_REVIEW_CHANGED: ${{ needs.detect.outputs.ci_review }}
          MCP_CATALOG_CHANGED: ${{ needs.detect.outputs.mcp_catalog }}
          SUPPLY_CHAIN_REVIEW: ${{ needs.supply-chain.outputs.critical_findings }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          enabled = lambda name: os.environ.get(name) == "true"
          event_name = os.environ.get("EVENT_NAME", "")

          required = {
              "detect",
              "policy",
              "runtime-tests",
              "image",
              "uv-lockfile",
              "dependency-gates",
          }
          if event_name == "pull_request":
              required.add("history-check")
          if enabled("PYTHON_CHANGED"):
              required.update({"full-tests", "lint", "e2e-desktop"})
              if event_name == "pull_request":
                  required.add("contributor-check")
          if enabled("FRONTEND_CHANGED"):
              required.update({"js-tests", "e2e-desktop"})
          if enabled("SITE_CHANGED"):
              required.add("docs-site")
          if enabled("DOCKER_META_CHANGED"):
              required.add("docker-lint")
          if event_name == "pull_request" and (
              enabled("SCAN_CHANGED") or enabled("DEPS_CHANGED")
          ):
              required.add("supply-chain")
          if event_name == "pull_request" and (
              enabled("CI_REVIEW_CHANGED")
              or enabled("MCP_CATALOG_CHANGED")
              or enabled("SUPPLY_CHAIN_REVIEW")
          ):
              required.add("review-labels")

          problems = []
          for name, info in sorted(needs.items()):
              result = info.get("result")
              expected = name in required
              valid = result == "success" if expected else result in {"success", "skipped"}
              print(f"{name}: {result} ({'required' if expected else 'not applicable'})")
              if not valid:
                  problems.append(f"{name}={result}")

          if problems:
              print(f"Shadow lanes did not satisfy the contract: {', '.join(problems)}")
              raise SystemExit(1)
          print("All applicable running-stack shadow lanes passed")
          PY
