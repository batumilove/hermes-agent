name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@c57efbd425546040d6a9b7ffb446198cbd5e29b8
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
