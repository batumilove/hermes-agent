name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@8140a50b5ebc10f6b6d1bdf129555c6344a331fd
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
