name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@da075bf5b386fcb3aec15be52c5bc2078ead3698
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
