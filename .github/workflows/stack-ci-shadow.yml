name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@a2e50d44291764c394e393ef88474bc926ec7a0e
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
