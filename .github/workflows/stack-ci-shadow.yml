name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@3c1cd919a029fe69a9521f9f5edd2614e25271a7
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
