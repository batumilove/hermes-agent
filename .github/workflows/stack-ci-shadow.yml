name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@9890d8b70d4d498bb872bbcfe644383164f234a1
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
