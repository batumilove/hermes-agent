name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@3f3c152a42b914eec347050edb56e111f7299c9f
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
