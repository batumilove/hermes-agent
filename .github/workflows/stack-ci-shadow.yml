name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@b94325e71fe2eabc70af60719d7984f7d66bb723
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
