name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@a30aa9dc370c4aa1f2f4e7771a12e71c80e5ec36
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
