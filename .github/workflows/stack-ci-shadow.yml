name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@e2de0980d2898b3b629119cce4c3662b5988ff0a
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
