name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@eb9a4559046bbb8035390d91a869ffa1470f641d
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
