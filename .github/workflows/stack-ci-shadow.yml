name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@93b014d82872a66a58366989fc21f48624352f55
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
