name: Running stack CI shadow

on:
  pull_request:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    uses: batumilove/hermes-ops/.github/workflows/shadow-validation.yml@965265a33a44913a783f055e02a2095a82a7a1e7
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
