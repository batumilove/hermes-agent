name: Promote or roll back Hermes deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [batumi-staging, batumi-production]
      operation:
        required: true
        type: choice
        options: [deploy, rollback]
      image_digest:
        description: Immutable digest required for deploy
        required: false
        type: string
      source_sha:
        description: Exact source commit represented by the digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    uses: batumilove/hermes-ops/.github/workflows/compose-deploy.yml@6be80bd51b29dca2192dfb8417e37945ac81761d
    with:
      environment: ${{ inputs.environment }}
      operation: ${{ inputs.operation }}
      image_digest: ${{ inputs.image_digest }}
      source_sha: ${{ inputs.source_sha }}
      ops_sha: 6be80bd51b29dca2192dfb8417e37945ac81761d
    secrets: inherit
