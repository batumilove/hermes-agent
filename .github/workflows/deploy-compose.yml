name: Publish and deploy Hermes image

on:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: hermes-staging-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'batumilove/hermes-agent'
    uses: batumilove/hermes-ops/.github/workflows/build-image.yml@3f3c152a42b914eec347050edb56e111f7299c9f
    with:
      source_sha: ${{ github.sha }}
      ops_sha: 3f3c152a42b914eec347050edb56e111f7299c9f
      deployment_lane: ${{ github.ref_name == 'rebuild/batumi-live' && 'candidate' || 'live' }}
    secrets: inherit

  deploy-staging:
    needs: publish
    if: vars.HERMES_STAGING_DEPLOY_ENABLED == 'true'
    uses: batumilove/hermes-ops/.github/workflows/compose-deploy.yml@3f3c152a42b914eec347050edb56e111f7299c9f
    with:
      environment: batumi-staging
      operation: deploy
      image_digest: ${{ needs.publish.outputs.digest }}
      source_sha: ${{ needs.publish.outputs.source_sha }}
      ops_sha: 3f3c152a42b914eec347050edb56e111f7299c9f
    secrets: inherit
