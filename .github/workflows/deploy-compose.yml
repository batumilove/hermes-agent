name: Publish immutable Hermes image

# Publication-only bridge: restoring automatic promotion/deployment requires
# a separately reviewed caller change. No push-triggered publication occurs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-staging-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'batumilove/hermes-agent'
    permissions:
      attestations: write
      checks: read
      contents: read
      id-token: write
      packages: write
    uses: batumilove/hermes-ops/.github/workflows/build-image.yml@c89af38733b73087883609110a0a5e69e83c5c63
    with:
      source_sha: ${{ github.sha }}
      ops_sha: c89af38733b73087883609110a0a5e69e83c5c63
      immutable_only: true
      deployment_lane: live
    secrets: inherit
