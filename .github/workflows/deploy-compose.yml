name: Publish and deploy Hermes image

on:
  push:
    branches: [batumi/live]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: hermes-staging-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'batumilove/hermes-agent'
    uses: batumilove/hermes-ops/.github/workflows/build-image.yml@9890d8b70d4d498bb872bbcfe644383164f234a1
    with:
      source_sha: ${{ github.sha }}
      ops_sha: 9890d8b70d4d498bb872bbcfe644383164f234a1
    secrets: inherit

  deploy-staging:
    needs: publish
    if: vars.HERMES_STAGING_DEPLOY_ENABLED == 'true'
    uses: batumilove/hermes-ops/.github/workflows/compose-deploy.yml@9890d8b70d4d498bb872bbcfe644383164f234a1
    with:
      environment: batumi-staging
      operation: deploy
      image_digest: ${{ needs.publish.outputs.digest }}
      source_sha: ${{ needs.publish.outputs.source_sha }}
      ops_sha: 9890d8b70d4d498bb872bbcfe644383164f234a1
    secrets: inherit
