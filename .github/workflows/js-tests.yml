# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: JS & TS checks (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [other, '1', '2', '3', '4']
    # Four isolated UI partitions; dynamic non-UI checks execute once.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit }}
      - name: Set up the locked JS build toolchain
        id: node
        uses: ./.github/actions/setup-pm
        with:
          # Desktop checks also run Python payload and icon build helpers, and
          # the electron contracts drive real hermes_cli/pm code through
          # HERMES_PYTHON, which needs the application dependencies.
          toolchain: all
          extras: '[]'
          test-environment: 'true'

      - name: Install zsh and a virtual display for Electron
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y zsh xvfb \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      # setup-pm caches npm downloads, not the installed workspace tree.
      # The job then extracts the full workspace node_modules
      # again and runs the native postinstalls again. Electron's binary is
      # prepared explicitly below. This caches the installed tree itself, keyed on the
      # lockfile and local dependency sources, and skips ``npm ci`` on an exact hit.
      # There are no restore-keys: a partial hit leaves a stale tree, so anything other
      # than an exact input match reinstalls from the start. Vendored file dependencies
      # are copied into node_modules, so their source bytes must invalidate the tree.
      #
      # This install runs only scripts admitted by the reviewed exact-version
      # policy; strict mode rejects missing trusted lockfile identities.
      # The cache version excludes older trees with blocked postinstalls.
      # This install runs WITH scripts, so the tree holds the postinstall
      # artifacts. The postinstall of electron unpacks its binary into
      # node_modules/electron/dist, which is inside the cached tree.
      #
      # The ~/.cache/electron download cache stays out of the key on purpose.
      # ``npm ci`` is skipped on a hit, so nothing reads that cache. It only
      # makes the archive larger.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-v2-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-npm${{ steps.node.outputs.npm-version }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc', 'pm/lock.json', 'vendor/npm/**') }}

      # Vitest records each file's duration and result under
      # node_modules/.vite/vitest and orders the next run from it, longest first.
      # The run that misses the cache writes it before the post step saves the
      # tree, so every hit until the next lockfile change replays that one run's
      # order: the slowest jsdom suites all start cold together and starve the
      # rest past their 15s timeout. Drop it so each run orders from scratch.
      - name: Drop vitest run history from the restored tree
        run: rm -rf node_modules/.vite/vitest apps/*/node_modules/.vite/vitest ui-tui/node_modules/.vite/vitest ui-tui/packages/*/node_modules/.vite/vitest tests-js/node_modules/.vite/vitest web/node_modules/.vite/vitest

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci --ignore-scripts=false --strict-allow-scripts

      - name: Install the locked website test inputs
        # website is a separate graph; tests-js exercises its installed consumers.
        uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts --no-fund --no-audit
          working-directory: website

      - name: Prepare locked Electron runtime before parallel checks
        run: node scripts/build/electron-runtime.mjs --source .

      # The WhatsApp bridge is a standalone npm package, outside the root
      # workspaces, so run-workspace-checks never sees it. Two of its suites
      # import @whiskeysockets/baileys, so install its own lockfile first;
      # --ignore-scripts because the tests need no native build.
      - name: Install WhatsApp bridge dependencies
        if: matrix.lane == 'other'
        uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/whatsapp-bridge
      - name: Run WhatsApp bridge node tests
        if: matrix.lane == 'other'
        run: node --test scripts/whatsapp-bridge/*.test.mjs

      - name: Protected sharding contracts
        run: node --test .github/scripts/ui-sharding.test.mjs .github/scripts/ui-discovery.test.mjs
      - name: Run discovered lane
        run: node .github/scripts/run-ui-lane.mjs '${{ matrix.lane }}'
      - name: Upload lane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-lane-${{ matrix.lane }}
          path: /var/tmp/hermes-ui-receipts/${{ matrix.lane }}.json
          if-no-files-found: error
      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py): a test or CI step that
        # leaves an untracked or modified file in the checkout is reported here. Runs only when
        # every earlier step passed: a step that failed midway can leave its own temp files
        # (a half-extracted download, a worktree its later cleanup never removed).
        uses: ./.github/actions/check-clean-worktree

  aggregate:
    name: JS coverage aggregate
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.commit }}
      - name: Require every selected matrix lane
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: js-lane-*
          path: /var/tmp/js-lane-aggregate
          merge-multiple: true
      - name: Validate exact-once receipts
        run: node .github/scripts/run-ui-lane.mjs aggregate /var/tmp/js-lane-aggregate
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
