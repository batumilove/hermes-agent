version: 1

upstream:
  repository: NousResearch/hermes-agent
  branch: main
  base_file: .github/upstream-base

patches:
  - id: fork-patch-governance
    kind: operations
    rationale: >-
      Require every fork-to-upstream path delta to have an explicit owner,
      verification command, and retirement condition.
    paths:
      - .github/batumi-patches.yaml
      - .github/batumi-contracts.yaml
      - .github/batumi-components.lock.yaml
      - .github/upstream-base
      - .github/workflows/ci.yml
      - .github/workflows/contributor-check.yml
      - .github/workflows/deploy-compose.yml
      - .github/workflows/promote-compose.yml
      - .github/workflows/stack-ci-shadow.yml
      - .github/workflows/staging-telegram-socket-diagnostics.yml
      - .github/workflows/upstream-sync.yml
      - contributors/emails/hermes@local
      - scripts/check_fork_delta.py
      - scripts/install_batumi_components.py
      - scripts/run_batumi_contracts.py
      - tests/scripts/test_check_fork_delta.py
      - tests/scripts/test_ci_workflow.py
      - tests/scripts/test_install_batumi_components.py
      - tests/scripts/test_run_batumi_contracts.py
      - tests/scripts/test_upstream_sync_workflow.py
    tests:
      - scripts/run_tests.sh tests/scripts/test_check_fork_delta.py tests/scripts/test_ci_workflow.py tests/scripts/test_install_batumi_components.py tests/scripts/test_upstream_sync_workflow.py
    retirement: Retain while batumi/live carries any fork-only patch.

  - id: safe-update-eol-normalization
    kind: core
    rationale: >-
      Force Git to invalidate checkout stat data before classifying CRLF-only
      churn so managed updates cannot miss part of a large rewritten tree.
    paths:
      - hermes_cli/update_cmd.py
      - tests/hermes_cli/test_update_eol_churn.py
    tests:
      - scripts/run_tests.sh tests/hermes_cli/test_update_eol_churn.py
    retirement: Remove when upstream forces an equivalent index refresh before EOL classification.

  - id: test-dns-isolation
    kind: compatibility
    rationale: >-
      Prevent reserved fixture hostnames from escaping tests into libc DNS while
      preserving ordinary DNS behavior for tests that explicitly require it.
    paths:
      - test_support/__init__.py
      - test_support/dns_guard.py
      - tests/conftest.py
      - tests/test_dns_isolation.py
      - tests/plugins/image_gen/test_xai_provider.py
    tests:
      - scripts/run_tests.sh tests/test_dns_isolation.py
      - scripts/run_tests.sh tests/plugins/image_gen/test_xai_provider.py
    retirement: Remove when upstream provides an equivalent pre-import DNS guard with explicit per-test opt-out coverage.

  - id: gateway-session-request-resource-lifecycle
    kind: core
    rationale: >-
      Release per-thread SessionDB read connections when workers terminate and
      close idle cached request clients at turn boundaries without interrupting
      concurrent request owners.
    paths:
      - hermes_state.py
      - run_agent.py
      - tests/agent/test_request_client_reuse.py
      - tests/agent/test_turn_finalizer_cleanup_guard.py
      - tests/test_session_db_read_path_split.py
    tests:
      - scripts/run_tests.sh tests/test_session_db_read_path_split.py tests/agent/test_request_client_reuse.py tests/agent/test_turn_finalizer_cleanup_guard.py
      - scripts/run_tests.sh tests/run_agent/test_run_agent.py
    retirement: Remove when upstream releases dead-thread SessionDB readers and closes idle request pools at turn boundaries with equivalent ownership and real-socket contracts.

  - id: sessiondb-write-latency-diagnostics
    kind: core
    rationale: >-
      Attribute slow SessionDB writes to Python lock wait, SQLite transaction
      acquisition, callback, and commit phases without logging session content.
    paths:
      - hermes_state.py
      - tests/test_session_db_write_latency_logging.py
    tests:
      - scripts/run_tests.sh tests/test_session_db_write_latency_logging.py tests/state/test_write_lock_patience.py
    retirement: Remove when upstream provides equivalent privacy-bounded phase timing and lock-owner attribution for SessionDB writes.

  - id: plugin-environment-backends
    kind: core
    rationale: >-
      Let external plugins register terminal execution environments without
      adding product-specific branches to the core terminal tool.
    paths:
      - hermes_cli/plugins.py
      - tools/environments/__init__.py
      - tools/environments/registry.py
      - tools/terminal_tool.py
      - tests/tools/test_environment_registry.py
      - website/docs/developer-guide/plugins/index.md
    tests:
      - scripts/run_tests.sh tests/tools/test_environment_registry.py tests/tools/test_terminal_tool_requirements.py
    retirement: Remove when upstream exposes an equivalent session-stable environment backend registry.

  - id: final-output-policy-context
    kind: core
    rationale: >-
      Give output-policy plugins detached conversation context and the active
      workdir so evidence and workspace footers can remain outside the loop.
    paths:
      - agent/turn_finalizer.py
      - tests/agent/test_transform_llm_output_context.py
      - website/docs/user-guide/features/hooks.md
    tests:
      - scripts/run_tests.sh tests/agent/test_transform_llm_output_context.py
    retirement: Remove when upstream transform_llm_output supplies equivalent read-only context.

  - id: side-effect-evidence-regulator
    kind: core
    rationale: >-
      Require current-turn execution evidence before preserving fresh external
      side-effect claims in final responses while leaving descriptive parity
      headings unchanged.
    paths:
      - agent/side_effect_evidence.py
      - agent/turn_finalizer.py
      - tests/agent/test_side_effect_evidence_reconciliation.py
      - tests/agent/test_turn_finalizer_final_response_persistence.py
    tests:
      - scripts/run_tests.sh tests/agent/test_side_effect_evidence_reconciliation.py tests/agent/test_turn_finalizer_final_response_persistence.py
    retirement: Remove when upstream provides equivalent fail-closed current-turn side-effect evidence validation.

  - id: provider-fallback-lifecycle
    kind: core
    rationale: >-
      Expose provider fallback transitions to edge telemetry and re-arm
      exhaustion reporting when a later fallback episode begins.
    paths:
      - agent/agent_runtime_helpers.py
      - agent/chat_completion_helpers.py
      - agent/conversation_loop.py
      - gateway/run.py
      - hermes_cli/plugins.py
      - tests/hermes_cli/test_plugins.py
      - tests/run_agent/test_24996_fallback_exhaustion_cooldown.py
      - website/docs/developer-guide/plugins/index.md
      - website/docs/user-guide/features/hooks.md
    tests:
      - scripts/run_tests.sh tests/run_agent/test_24996_fallback_exhaustion_cooldown.py tests/hermes_cli/test_plugins.py
    retirement: Remove when upstream provides equivalent observer hooks and episode reset.

  - id: kimi-billing-classification
    kind: core
    rationale: >-
      Treat Kimi's billing-cycle usage-limit 403 as non-retryable billing so
      credential rotation and provider fallback occur immediately.
    paths:
      - agent/error_classifier.py
      - tests/agent/test_error_classifier.py
    tests:
      - scripts/run_tests.sh tests/agent/test_error_classifier.py
    retirement: Remove when upstream classifies the same Kimi response as billing.

  - id: cron-verbatim-delivery
    kind: core
    rationale: >-
      Preserve the documented byte-for-byte stdout delivery contract for
      script-only no-agent cron jobs even when global wrapping is enabled.
    paths:
      - cron/scheduler.py
      - tests/cron/test_scheduler.py
    tests:
      - scripts/run_tests.sh tests/cron/test_scheduler.py
    retirement: Remove when upstream no-agent deliveries remain verbatim by default.

  - id: honcho-connection-lifecycle
    kind: core
    rationale: >-
      Close replaced and reset Honcho clients deterministically, and disable
      idle keepalive so peer-closed HTTP connections are not retained between
      intermittent memory operations.
    paths:
      - plugins/memory/honcho/client.py
      - tests/honcho_plugin/test_connection_lifecycle.py
    tests:
      - scripts/run_tests.sh tests/honcho_plugin/test_connection_lifecycle.py tests/honcho_plugin/test_client.py
    retirement: Remove when upstream owns injected Honcho clients and passes the same reset, replacement, and no-idle-pool contracts.

  - id: honcho-operational-monitoring
    kind: operations
    rationale: >-
      Preserve the production Honcho health monitor and queue diagnostic used
      by Hermes cron, together with their fail-closed behavior contracts.
    paths:
      - hermes_cli/honcho_monitor.py
      - hermes_cli/honcho_queue_diagnostic.py
      - scripts/honcho_monitor.py
      - tests/hermes_cli/test_honcho_monitor.py
      - tests/hermes_cli/test_honcho_queue_diagnostic.py
    tests:
      - scripts/run_tests.sh tests/hermes_cli/test_honcho_monitor.py tests/hermes_cli/test_honcho_queue_diagnostic.py
    retirement: Remove when the live watchdog and diagnostics migrate to a durable operations package that no longer imports these modules.

  - id: cron-ephemeral-telegram-topics
    kind: core
    rationale: >-
      Preserve the existing config key that creates one private Telegram topic
      per cron output without persisting generated topic mappings.
    paths:
      - cron/scheduler.py
      - gateway/delivery.py
      - hermes_cli/config_defaults.py
      - plugins/platforms/telegram/adapter.py
      - tests/gateway/test_ephemeral_telegram_topics.py
    tests:
      - scripts/run_tests.sh tests/gateway/test_ephemeral_telegram_topics.py tests/gateway/test_delivery.py tests/gateway/test_dm_topics.py
    retirement: Remove when upstream offers equivalent config and nonpersistent topic ownership.

  - id: telegram-cancellation-socket-ownership
    kind: core
    rationale: >-
      Close raw connect, TLS, response-header, and response-body streams under
      repeated caller cancellation while preserving route-safe diagnostics and
      upstream's bounded lazy fallback pools.
    paths:
      - plugins/platforms/telegram/telegram_network.py
      - tests/gateway/test_telegram_fallback_pool_release_71593.py
      - tests/gateway/test_telegram_network.py
      - tests/gateway/test_telegram_request_phase_real_socket.py
      - tests/gateway/test_telegram_terminal_close_regression.py
    tests:
      - scripts/run_tests.sh tests/gateway/test_telegram_fallback_pool_release_71593.py tests/gateway/test_telegram_network.py tests/gateway/test_telegram_request_phase_real_socket.py
      - scripts/run_tests.sh tests/gateway/test_telegram_network_reconnect.py tests/gateway/test_platform_reconnect_fd_leak.py
    retirement: Remove when upstream passes the repeated-cancel real-socket contract.

  - id: gateway-delivery-shutdown-correctness
    kind: core
    rationale: >-
      Keep final delivery fail-open under ledger contention, prevent retries
      while Telegram's polling health gate is degraded, serialize topic
      recovery without blocking the event loop, and bound shutdown cleanup
      while retaining ownership of non-cancellable worker operations.
    paths:
      - gateway/delivery_ledger.py
      - gateway/platforms/base.py
      - gateway/run.py
      - plugins/platforms/telegram/adapter.py
      - tests/gateway/test_delivery_ledger_producer.py
      - tests/gateway/test_gateway_shutdown.py
      - tests/gateway/test_session_hygiene.py
      - tests/gateway/test_shutdown_aggregate_budget_contract.py
      - tests/gateway/test_telegram_send_path_degraded_retry.py
      - tests/gateway/test_telegram_text_batching.py
      - tests/test_session_db_recall_reader.py
    tests:
      - scripts/run_tests.sh tests/gateway/test_delivery_ledger_producer.py tests/gateway/test_gateway_shutdown.py tests/gateway/test_shutdown_aggregate_budget_contract.py
      - scripts/run_tests.sh tests/gateway/test_session_hygiene.py tests/gateway/test_telegram_send_path_degraded_retry.py tests/gateway/test_telegram_text_batching.py tests/test_session_db_recall_reader.py
    retirement: Remove individual paths when upstream passes their contention, cancellation, degraded-delivery, and aggregate-shutdown contracts.
