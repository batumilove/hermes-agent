  retirement: Remove when upstream documents equivalent authorized OTP input and secret-isolation boundaries.
- id: ci-aggregate-bounded-context
  kind: operations
  rationale: Pass every dependency result and detector lane selection to the required gate without
    review report bodies, which can exceed the runner's per-environment-value launch limit.
  paths:
  - .github/workflows/ci.yaml
  - tests/ci/test_gate_workflow_context.py
  tests:
  - scripts/run_tests.sh tests/ci/test_gate_workflow_context.py tests/ci/test_required_results.py
  retirement: Remove when upstream bounds aggregate gate context while retaining every required result.
- id: nix-managed-guard-pipefail
  kind: operations
  rationale: Consume the complete managed-mode command output when matching the guard message so
    grep does not close the pipe early and make echo fail under the Nix builder's pipefail shell.
  paths:
  - nix/checks.nix
  tests:
  - nix build .#checks.x86_64-linux.managed-guard
  retirement: Remove when upstream's managed guard check drains command output under pipefail.
- id: brotlicffi-decoder-security-fix
  kind: operations
  rationale: Pin brotlicffi 1.2.1.0 to fix PYSEC-2026-4323 with the user-approved
    package-specific release cooldown exception; preserve the global three-day policy.
  paths:
  - pyproject.toml
  - uv.lock
  - pm/AGENTS.md
  - tests/test_packaging_metadata.py
  tests:
  - python -m pm.build_env --source . --check-lock
  - scripts/run_tests.sh tests/test_packaging_metadata.py
  retirement: Remove when the accepted upstream baseline includes the fixed decoder release.
- id: october-lockfile-advisory-remediation
  kind: operations
  rationale: Keep lockfile, build and npm workspace dependencies outside the October 24
    advisory boundaries while preserving pinned Electron scripts and major-specific HTTP overrides.
  paths:
  - pyproject.toml
  - uv.lock
  - package.json
  - package-lock.json
  - .npmrc
  - apps/desktop/package.json
  - ui-tui/package.json
  - tests-js/package.json
  - tests-js/security-lock-floors.test.ts
  - website/package.json
  - website/package-lock.json
  - website/.npmrc
  - scripts/whatsapp-bridge/package.json
  - scripts/whatsapp-bridge/package-lock.json
  - plugins/platforms/photon/sidecar/package.json
  - plugins/platforms/photon/sidecar/package-lock.json
  - scripts/termux/build_config.sh
  - scripts/termux/build_wheels.py
  - tests/test_packaging_metadata.py
  tests:
  - scripts/run_tests.sh tests/test_packaging_metadata.py tests/pm/test_project_relock.py
  - npm --workspace tests-js test -- security-lock-floors.test.ts
  retirement: Remove when the accepted upstream baseline resolves all reviewed advisory boundaries.

