version: 1
upstream:
  repository: NousResearch/hermes-agent
  branch: main
  base_file: .github/upstream-base
  provenance_file: .github/upstream-sync-provenance.json
patches:
- id: qs-svgr-unused-deepmerge-remediation
  kind: compatibility
  rationale: Resolve qs security fixes and remove the unused vulnerable deepmerge
    declaration from an integrity-verified SVGR plugin derivative without changing
    upstream executable bytes or suppressing advisories.
  paths:
  - scripts/whatsapp-bridge/package-lock.json
  - website/.npmrc
  - website/package.json
  - website/package-lock.json
  - website/scripts/test-security-dependencies.cjs
  - website/vendor/svgr-plugin-svgo/**
  tests:
  - node website/scripts/test-security-dependencies.cjs
  - npm --prefix website audit --registry=https://registry.npmjs.org
  - npm --prefix scripts/whatsapp-bridge audit --registry=https://registry.npmjs.org
  retirement: Remove the derivative when a maintained upstream plugin removes or
    fixes deepmerge and the resolved graph, consumer probes and website build pass.
- id: s6-waited-cleanup-immutable-publication
  kind: operations
  rationale: Preserve bounded gateway-only shutdown before the short s6 sweep and
    exact named/packaged foreground ownership. Rebind the hosted caller to the
    reviewed immutable-only publisher with truthful caller SHA. The temporary
    bridge is manual-only and has no deployment job, even when staging is enabled.
    Source tests require the repository Python test environment; full-image
    acceptance additionally requires Docker, a rebuilt exact-source image and
    disposable data volumes. No live credentials are needed for offline tests.
  paths:
  - Dockerfile
  - docker-compose.yml
  - docker-compose.windows.yml
  - docker/cont-finish.d/10-gateway-stop
  - docker/wait-gateway-stop.py
  - hermes_cli/service_manager.py
  - tests/docker/NAMED_PROFILE_IDENTITY.md
  - tests/docker/S6_CLEANUP_BUDGET.md
  - tests/docker/s6_cleanup_probe.py
  - tests/docker/test_named_gateway_identity.py
  - tests/docker/test_s6_container_cleanup.py
  - tests/docker/test_s6_wait_contract.py
  - tests/docker/test_immutable_publication_caller.py
  - .github/workflows/deploy-compose.yml
  - website/docs/user-guide/docker.md
  tests:
  - scripts/run_tests.sh tests/docker/test_named_gateway_identity.py tests/docker/test_s6_wait_contract.py tests/docker/test_immutable_publication_caller.py
  retirement: Remove shutdown delta after equivalent upstream gateway-only waited
    cleanup and owner binding land. Replace the manual publication-only bridge
    only through a reviewed change explicitly authorizing promotion/deployment.
- id: mattermost-bounded-thread-context
  kind: compatibility
  rationale: Preserve a validated root reply pointer and bounded thread history on first entry,
    without rehydrating persisted or reset sessions. Fetch only authorized, same-channel context;
    keep historical text as quoted data and preserve current mention-routing behavior.
  paths:
  - plugins/platforms/mattermost/adapter.py
  - plugins/platforms/mattermost/reply_context.py
  - tests/gateway/test_mattermost_reply_context.py
  tests:
  - scripts/run_tests.sh tests/gateway/test_mattermost_reply_context.py tests/gateway/test_mattermost.py tests/gateway/test_mattermost_mention_routing.py tests/gateway/test_mattermost_native_admission.py
  retirement: Remove when upstream provides equivalent bounded, authorized thread hydration,
    reset-session isolation, and root-pointer regression coverage in the Mattermost plugin.
- id: optional-migration-pm-receipts
  kind: core
  rationale: Keep unrelated existing version-incompatible plugins out of staged publication,
    preserve mandatory PM preparation receipts across best-effort catalog migrations, and
    align completion exit status with a partial terminal receipt.
  paths:
  - pm/publication.py
  - scripts/ci/classify_changes.py
  - hermes_cli/source_build.py
  - hermes_cli/update_completion.py
  - tests/pm/test_admission_sitout_contract.py
  - tests/pm/test_worker_publication.py
  - tests/hermes_cli/test_update_optional_migration_receipts.py
  - website/docs/getting-started/updating.md
  tests:
  - scripts/run_tests.sh tests/pm/test_admission_sitout_contract.py tests/pm/test_worker_publication.py tests/hermes_cli/test_update_optional_migration_receipts.py tests/hermes_cli/test_update_receipt_pm_embed.py tests/hermes_cli/test_update_completion_process.py tests/hermes_cli/test_source_build.py
  - scripts/run_tests.sh tests/ci/test_classify_changes.py tests/ci/test_update_transitive_routing.py
  - scripts/run_tests.sh tests/ci/test_update_ci_routing.py -k test_every_module_an_update_entry_point_imports_starts_its_suite
  retirement: Remove when upstream preserves these staged admission and optional migration receipt contracts.
- id: live-restore-durable-state-assertion
  kind: compatibility
  rationale: Verify restore refusal preserves database and WAL bytes plus admission rows without treating SQLite shared-memory reader bookkeeping as durable data.
  paths:
  - tests/hermes_cli/test_update_restore_authority.py
  tests:
  - scripts/run_tests.sh tests/hermes_cli/test_update_restore_authority.py
  retirement: Remove when upstream live-restore tests distinguish durable state from volatile SQLite read marks.
- id: startup-scheduler-live-status
  kind: core
  rationale: Bind the startup ticker to the runner so control status reports its actual liveness.
  paths:
  - gateway/run_bootstrap.py
  - tests/gateway/test_bootstrap_scheduler_status.py
  tests:
  - scripts/run_tests.sh tests/gateway/test_bootstrap_scheduler_status.py tests/gateway/test_external_drain_control.py
  retirement: Remove when upstream startup and live control status share the same ticker handle.
- id: mattermost-exact-fleet-mention-routing
  kind: compatibility
  rationale: Match complete case-insensitive Mattermost username tokens, strip only the
    receiving bot's own mentions, and suppress non-target fleet bots even in free-response
    channels. Preserve the explicit six-bot fleet roster, channel allowlists and DM bypass.
    Offline adapter tests require the repository test environment with Mattermost plugin
    dependencies; no server credentials or live messaging are required. The operator-approved
    contributor alias attributes Hermes-prepared PR409 commits to batumilove without rewriting history.
  paths:
  - contributors/emails/hermes-candidate@localhost.invalid
  - plugins/platforms/mattermost/adapter.py
  - tests/gateway/test_mattermost_mention_routing.py
  tests:
  - scripts/run_tests.sh tests/gateway/test_mattermost_mention_routing.py tests/gateway/test_mattermost.py
  retirement: Remove when upstream provides equivalent exact-token own-mention routing
    and explicit fleet-target suppression with regression coverage for blank identities,
    username suffixes and simultaneous own/other fleet mentions.
- id: browse-schema-begin-budget-refusal
  kind: core
  rationale: Budget preparatory durability SQL and transaction admission during additive browse reconciliation, reporting deadline interrupts as bounded no-write refusals with the repair remedy.
  paths:
  - hermes_state_reconcile.py
  - tests/hermes_state/test_reconcile_budget.py
  tests:
  - scripts/run_tests.sh tests/hermes_state/test_reconcile_budget.py tests/hermes_cli/test_browse_schema_drift.py
  retirement: Remove when upstream includes durability preparation and transaction admission in the browse budget error boundary.
- id: desktop-update-process-diagnostics
  kind: core
  rationale: Identify private-install Electron processes by executable custody when argv/environment are rewritten; retain teardown diagnostics.
  paths:
  - tests-js/scripts/desktop-smoke-launch-failure.test.ts
  - apps/desktop/e2e/update/harness.ts
  - apps/desktop/e2e/update/app-update.spec.ts
  - apps/desktop/e2e/update/install-processes.ts
  - apps/desktop/e2e/update/install-processes.unit.test.ts
  tests:
  - npm run typecheck --workspace apps/desktop
  retirement: Remove diagnostics once the repeated Linux desktop relaunch and teardown failures are resolved.
- id: october-security-dependency-remediation
  kind: core
  rationale: Pin patched image, TLS trust, redirect, sanitizer and development-server
    dependencies without suppressing dependency validation. A reproducible metadata-only
    browser-harness wheel admits patched Pillow; the user-approved certifi release-age
    exception is bounded to its security release and expires for removal on October 23.
  paths:
  - pyproject.toml
  - uv.lock
  - .npmrc
  - package.json
  - package-lock.json
  - website/package.json
  - website/package-lock.json
  - apps/bootstrap-installer/package.json
  - apps/desktop/package.json
  - web/package.json
  - pm/AGENTS.md
  - pm/workspace.py
  - pm/vendor/README.md
  - pm/vendor/rebuild_browser_harness.py
  - pm/vendor/browser_harness-0.1.13+hermes.1-py3-none-any.whl
  - tests/pm/test_workspace.py
  - tests/test_packaging_metadata.py
  tests:
  - scripts/run_tests.sh tests/pm/test_workspace.py tests/tools/test_browser_use_harness.py
  retirement: Remove certifi exception after 2026-10-23T02:24:16Z and vendored wheel
    when upstream browser-harness permits patched Pillow; retain security floors.
- id: post-turn-owning-context-engine
  kind: core
  rationale: Pass the agent-owned context engine to post-turn persistence hooks so
    consumers do not replay persisted history through another registered engine.
  paths:
  - agent/turn_finalizer.py
  - tests/agent/test_post_turn_engine_handoff.py
  tests:
  - scripts/run_tests.sh tests/agent/test_post_turn_engine_handoff.py
  retirement: Remove when upstream passes the owning context engine to post_llm_call
    while preserving the detached-agent publication guard.
- id: ci-compare-response-bound
  kind: operations
  rationale: Read only the first GitHub compare page so large consolidations cannot
    exhaust detection's job budget; run every lane at the API's 300-file cap so
    truncated diffs never hide required checks.
  paths:
  - .github/actions/detect-changes/action.yml
  - tests/ci/test_detect_changes_compare.py
  tests:
  - scripts/run_tests.sh tests/ci/test_detect_changes_compare.py tests/ci/test_classify_changes.py
  retirement: Remove when upstream bounds compare traversal and conservatively handles capped file lists.
- id: native-updater-scope-custody-enforcement
  kind: core
  rationale: Require verified runtime homes even for PID-file hints and user units; discover
    profile-before-gateway units and preserve unmerged index custody rather than reset it.
  paths:
  - hermes_cli/update_fleet_scope.py
  - hermes_cli/update_cmd_fleet.py
  - hermes_cli/update_cmd_stash.py
  - tests/hermes_cli/test_update_scope_custody_enforcement.py
  - tests/hermes_cli/test_update_concurrent_quarantine.py
  - tests/hermes_cli/test_update_pause_service_rollback.py
  tests:
  - scripts/run_tests.sh tests/hermes_cli/test_update_scope_custody_enforcement.py tests/hermes_cli/test_update_autostash.py tests/hermes_cli/test_update_fleet_home_scope.py
  retirement: Remove when upstream enforces verified fleet ownership and preserves unresolved conflict stages.
- id: native-updater-source-admission
  kind: core
  rationale: Check fixed storage headroom before checkout housekeeping; preserve selected
    no-op SHA and refuse unavailable/mismatched HEAD without changing ordinary fork merge semantics.
  paths:
  - hermes_cli/update_cmd.py
  - hermes_cli/update_source_preflight.py
  - tests/hermes_cli/test_update_source_preflight.py
  - tests/hermes_cli/test_update_narrow_candidate.py
  - tests/hermes_cli/test_update_completion_routing.py
  tests:
  - scripts/run_tests.sh tests/hermes_cli/test_update_source_preflight.py tests/hermes_cli/test_update_inventory.py tests/hermes_cli/test_update_target_identity.py
  retirement: Remove when upstream provides equivalent source admission and explicit inventory ownership evidence.
- id: native-updater-mandatory-pm-failure
  kind: core
  rationale: Propagate mandatory dependency preparation failures through the native updater's
    correlated receipt and completion status; do not activate or collect generations after PM failure.
  paths:
  - hermes_cli/update_completion.py
  - hermes_cli/update_receipt.py
  - tests/hermes_cli/test_update_completion_process.py
  - tests/hermes_cli/test_update_receipt_pm_embed.py
  - tests/e2e/core/upgrade/pm/test_stamps_and_doctor.py
  - tests/e2e/core/upgrade/git/test_hostile_post.py
  - tests/e2e/core/upgrade/git/test_hostile_pause.py
  - tests/hermes_cli/test_update_zip_completion.py
  - tests/hermes_cli/test_update_post_commit_safety.py
  tests:
  - scripts/run_tests.sh tests/hermes_cli/test_update_completion_process.py tests/hermes_cli/test_update_receipt_pm_embed.py
  retirement: Remove when upstream propagates mandatory PM failure as nonzero partial completion,
    preserves correlated failure receipts and blocks prepared activation after failed PM results.
- id: lcm-native-snapshot-provenance
  kind: core
  rationale: Preserve the context engine's native admission provenance while compression
    runs against a deep-copied snapshot, retaining no-hook compatibility and scope cleanup.
  paths:
  - agent/compression_facade.py
  - tests/agent/test_lcm_snapshot_scope.py
  tests:
  - scripts/run_tests.sh tests/agent/test_lcm_snapshot_scope.py tests/agent/test_compression_commit_fence_race.py
  retirement: Remove when upstream preserves equivalent native snapshot admission provenance,
    original no-op message identity, no-hook compatibility and exception cleanup.
- id: cron-live-worker-monitor-recovery
  kind: core
  rationale: Preserve an adopted live worker's claim when optional ledger observation fails
    with OSError or SQLite OperationalError; retry after five monotonic seconds so recovery
    remains observable. Programming and interface defects propagate, and the mandatory
    process-exit ledger read remains error-visible. Integration tests require Linux process
    and SQLite support, pytest-asyncio, psutil, and the checkout's test dependencies;
    run with a disposable HOME and HERMES_HOME, never the live scheduler store.
  paths:
  - cron/scheduler.py
  - cron/scheduler_detached_worker.py
  - tests/cron/test_worker_monitor_read_failure.py
  - tests/cron/test_worker_monitor_recovery.py
  - tests/cron/test_worker_monitor_integration.py
  tests:
  - scripts/run_tests.sh tests/cron/test_worker_monitor_read_failure.py tests/cron/test_worker_monitor_recovery.py tests/cron/test_worker_monitor_integration.py
  - scripts/run_tests.sh tests/cron/test_scheduler.py tests/cron/test_execution_ledger.py tests/cron/test_restart_safe_worker.py
  retirement: Remove when upstream preserves live-worker ownership across optional storage
    read failures with bounded retry, still-live recovery reaping, propagated programming
    defects and error-visible mandatory exit reads, with equivalent integration coverage.
- id: stage2-install-state-ownership
  kind: compatibility
  rationale: Repair root-owned installation state during container startup so the non-root
    runtime user can acquire installation locks, without widening modes, following symlinks,
    or changing unrelated host files. Real cross-UID tests require a non-root Linux runner
    with passwordless sudo; skipped runs are not ownership acceptance evidence.
  paths:
  - docker/stage2-hook.sh
  - tests/tools/test_stage2_hook_install_ownership.py
  tests:
  - bash -n docker/stage2-hook.sh
  - scripts/run_tests.sh tests/tools/test_stage2_hook_install_ownership.py
  retirement: Remove when upstream stage2 repairs installation-state ownership with equivalent
    mode-preserving, symlink-safe behavior and real cross-UID regression coverage.
- id: telegram-private-reply-anchor-retry
  kind: extension
  rationale: Retry rejected private message threads with the existing reply anchor, preserving the
    binding and refusing delivery when that anchor is also rejected.
  paths:
  - plugins/platforms/telegram/adapter.py
  - plugins/platforms/telegram/adapter_thread_retry.py
  - tests/gateway/test_telegram_thread_fallback.py
  tests:
  - scripts/run_tests.sh tests/gateway/test_telegram_thread_fallback.py
  retirement: Remove when upstream preserves private reply anchors across missing-thread retries.
- id: included-updater-operational-policy
  kind: operations
  rationale: Require the installation's included updater for application updates and remove
    custom activation controllers as an ordinary update prerequisite while preserving runtime
    identity, authorization and enforced lifecycle controls.
  paths:
  - AGENTS.md
  - website/docs/getting-started/updating.md
  - skills/autonomous-ai-agents/hermes-agent/SKILL.md
  - website/docs/user-guide/skills/bundled/autonomous-ai-agents/autonomous-ai-agents-hermes-agent.md
  tests:
  - python3 scripts/check
  retirement: Remove when upstream instructions require equivalent supported updater routing
    and no longer permit operational skills to impose custom deployment controllers by default.
- id: upstream-catalog-admission-split
  kind: operations
  rationale: Retain the previously accepted catalog while upstream code is reviewed separately.
    The deferred upstream entries land in a data-only follow-up PR under the unchanged
    catalog admission gate, without mixing entry pins and executable validation code.
  paths:
  - plugin-catalog/account-pool.yaml
  - plugin-catalog/agent-janitor.yaml
  - plugin-catalog/alans-way-computer.yaml
  - plugin-catalog/alans-way.yaml
  - plugin-catalog/anatomy-museum.yaml
  - plugin-catalog/author-feed.yaml
  - plugin-catalog/aux-ledger.yaml
  - plugin-catalog/birkin-mnemosyne.yaml
  - plugin-catalog/gmail.yaml
  - plugin-catalog/hermes-aac.yaml
  - plugin-catalog/hermes-activity.yaml
  - plugin-catalog/hermes-agent-mixer.yaml
  - plugin-catalog/hermes-insight.yaml
  - plugin-catalog/hermes-lang-ko.yaml
  - plugin-catalog/hermes-lang-pt-br.yaml
  - plugin-catalog/huddo.yaml
  - plugin-catalog/jp-egov-law.yaml
  - plugin-catalog/kiwi.yaml
  - plugin-catalog/kumiho-memory.yaml
  - plugin-catalog/lightningai-rate-limit.yaml
  - plugin-catalog/lightningai.yaml
  - plugin-catalog/model-router.yaml
  - plugin-catalog/nexus.yaml
  - plugin-catalog/nvidia-app.yaml
  - plugin-catalog/nvidia-broadcast.yaml
  - plugin-catalog/openinvest.yaml
  - plugin-catalog/plan-mode.yaml
  - plugin-catalog/qdrant-memory.yaml
  - plugin-catalog/secure-env-ingress.yaml
  - plugin-catalog/showly.yaml
  - plugin-catalog/speechify.yaml
  - plugin-catalog/switchbot-control.yaml
  - plugin-catalog/teamorouter.yaml
  - plugin-catalog/telegram-client.yaml
  - plugin-catalog/tinyfish.yaml
  - plugin-catalog/wait-ledger.yaml
  tests:
  - python scripts/check_fork_delta.py
  retirement: Remove after the data-only catalog follow-up is merged and the catalog matches
    the accepted upstream baseline; the shared-daemon migration can retire this split record.
- id: producer-generation-pythonpath-isolation
  kind: extension
  rationale: Keep successfully activated producer generations out of unrelated Python children after
    dependency selection advances, and release newly acquired leases when activation fails without
    discarding earlier successful producer ownership.
  paths:
  - pm/environments.py
  - tools/environments/local_pythonpath.py
  - tests/pm/test_producer_generation.py
  - website/docs/reference/package-management.md
  tests:
  - scripts/run_tests.sh tests/pm/test_producer_generation.py tests/pm/test_lease_reselection.py
    tests/pm/test_runtime_selection.py tests/tools/test_build_subprocess_env.py
    tests/tools/test_hermes_subprocess_env.py
  retirement: Remove when upstream preserves successful producer-generation provenance, cleans failed
    activation leases, and passes the same child-path and lease regressions.
- id: delegation-capacity-rejection-accounting
  kind: core
  rationale: Preserve bounded delegation capacity admission, interruption cleanup, and stable grouped
    rejection identities with terminal live-log accounting when no child worker is launched.
  paths:
  - tests/tools/test_delegate_capacity_busy.py
  - tests/tools/test_delegate_capacity_interrupt.py
  - tests/tools/test_delegate_grouped_rejection.py
  - tools/async_delegation.py
  - tools/delegate_tool_config.py
  - tools/delegation_live_log.py
  tests:
  - scripts/run_tests.sh tests/tools/test_delegate_capacity_busy.py tests/tools/test_delegate_capacity_interrupt.py
    tests/tools/test_delegate_grouped_rejection.py
  retirement: Remove when official upstream provides equivalent bounded capacity admission, interrupt
    cleanup, stable grouped rejection identities, and terminal accounting without launching child workers.
- id: feishu-webhook-authentication-quota
  kind: extension
  rationale: Authenticate Feishu callbacks before charging delivery quota, require a verified token for
    plaintext URL challenges, and bound callback parsing and anomaly state for the published GHSA-pmqc-57g8-c22c
    finding. Preserve valid signed events and authenticated challenge delivery.
  paths:
  - plugins/platforms/feishu/adapter.py
  - plugins/platforms/feishu/webhook_security.py
  - tests/plugins/platforms/feishu/test_webhook_security.py
  - website/docs/user-guide/messaging/feishu.md
  - website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/user-guide/messaging/feishu.md
  - tests/gateway/_plugin_adapter_loader.py
  tests:
  - scripts/run_tests.sh tests/plugins/platforms/feishu/test_webhook_security.py
  retirement: Remove when official upstream provides equivalent callback authentication, quota ordering,
    and bounded parsing/state with the same valid-event and challenge contracts.
- id: supply-chain-build-input-pinning
  kind: operations
  rationale: Pin npm bootstrap and Debian container inputs to reviewed immutable versions, suppress bootstrap
    lifecycle scripts, enforce the repository release-age policy, upgrade fixable packages already present
    in the pinned runtime base, replace vulnerable bundled npm and uv components, restrict reusable test
    workflow permissions, cover every tracked dependency lockfile in OSV, and reject equivalent unapproved
    global npm install syntax in CI and Docker dependency installs. PM pins and verifies a reviewed brace-expansion
    and Undici overlays before publishing npm; Nix consumes the same artifacts and verifier. PM
    removes Node's redundant npm bundle and Python's unused pip/bootstrap payload before recording
    store digests, while preserving distlib launcher generation. Image metadata derives its version
    from authenticated release/import provenance rather than the development placeholder.
  paths:
  - .github/workflows/deploy-site.yml
  - .github/workflows/docs-site-checks.yml
  - .github/workflows/e2e-desktop.yml
  - .github/workflows/js-autofix.yml
  - .github/workflows/js-tests.yml
  - .github/workflows/termux-verify.yml
  - .github/workflows/osv-scanner.yml
  - .github/workflows/docker-lint.yml
  - Dockerfile
  - .github/workflows/deploy-compose.yml
  - tests/scripts/test_js_tests_workflow.py
  - tests/scripts/test_osv_scanner_workflow.py
  - scripts/ci/osv_scan_inputs.py
  - tests/scripts/test_osv_scan_inputs.py
  - tests/tools/test_dockerfile_vulnerability_floors.py
  - pm/packages.py
  - pm/npm_security_overlay.py
  - pm/node_npm_layout.py
  - pm/python_bootstrap.py
  - pm/lock.json
  - docker/build_agent.py
  - scripts/build/agent.py
  - scripts/build/inputs.py
  - scripts/build/image_identity.py
  - scripts/build/mint_launchers.py
  - nix/npm-pinned.nix
  - nix/pm-packages.nix
  - tests/pm/test_npm_security_overlay.py
  - tests/pm/test_npm_self_install.py
  - tests/pm/test_node_npm_layout.py
  - tests/pm/test_python_bootstrap.py
  - tests/pm/test_cold_runtime_e2e.py
  - tests/pm/test_activation_setup.py
  - tests/pm/test_startup_recovery.py
  - tests/pm/test_node_libatomic_install_boundary.py
  - tests/pm/_fixtures.py
  - tests/pm/test_update_request_reuse.py
  - tests/scripts/test_image_identity.py
  - tests/scripts/test_termux_build_wheels.py
  - tests/scripts/test_fresh_source_install.py
  - scripts/install.sh
  - scripts/install.ps1
  tests:
  - python3 -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
  - hadolint Dockerfile
  - npm run check --workspace apps/desktop
  - scripts/run_tests.sh tests/scripts/test_js_tests_workflow.py tests/scripts/test_osv_scanner_workflow.py
    tests/tools/test_dockerfile_vulnerability_floors.py
  - scripts/run_tests.sh tests/pm/test_node_npm_layout.py tests/pm/test_npm_security_overlay.py
    tests/pm/test_npm_self_install.py tests/pm/test_python_bootstrap.py tests/scripts/test_image_identity.py
  retirement: Remove when upstream pins equivalent npm and Debian build inputs, restricts reusable workflow
    permissions, and scans every tracked dependency lockfile with matching lifecycle and release-age protections.
- id: browserslist-ghsa-73wf-remediation
  kind: operations
  rationale: Keep every root and website Browserslist resolution at 4.28.7 or newer so untrusted custom
    statistics cannot trigger the prototype-write and crash paths tracked by GHSA-73wf-gq98-2v4g, CVE-2026-73088,
    and CVE-2026-73089.
  paths:
  - package.json
  - package-lock.json
  - website/package.json
  - website/package-lock.json
  tests:
  - npx --yes npm@12.0.1 audit --audit-level=high
  - npx --yes npm@12.0.1 --prefix website audit --audit-level=high
  - npm run check
  - npm --prefix website run build
  retirement: Remove when the recorded upstream baseline resolves Browserslist 4.28.7 or newer in both
    root and website dependency scopes.
- id: high-severity-dependency-remediation
  kind: operations
  rationale: Keep the remaining fork dependency surfaces outside the Critical and High OSV advisories
    addressed by the September 2026 repository-wide lockfile remediation, while preserving an exact Electron
    runtime/build pin and a production-only Nix node-gyp dependency closure. October scanning updates
    exact desktop/docs floors and uses a hash-verified licensed braces derivative for the unpatched nesting
    advisory. Pin MCP 2.2.0 to close GHSA-84m7-p3x7-pcfv session resource exhaustion.
