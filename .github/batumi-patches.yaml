version: 1

upstream:
  repository: NousResearch/hermes-agent
  branch: main
  base_file: .github/upstream-base

patches:
  - id: fork-patch-governance
    kind: operations
    rationale: >-
      Require every fork-to-upstream path delta to have an explicit owner,
      verification command, and retirement condition.
    paths:
      - .github/batumi-patches.yaml
      - .github/upstream-base
      - .github/workflows/ci.yml
      - .github/workflows/upstream-sync.yml
      - scripts/check_fork_delta.py
      - tests/scripts/test_check_fork_delta.py
      - tests/scripts/test_upstream_sync_workflow.py
    tests:
      - scripts/run_tests.sh tests/scripts/test_check_fork_delta.py tests/scripts/test_upstream_sync_workflow.py
    retirement: Retain while batumi/live carries any fork-only patch.

  - id: plugin-environment-backends
    kind: core
    rationale: >-
      Let external plugins register terminal execution environments without
      adding product-specific branches to the core terminal tool.
    paths:
      - hermes_cli/plugins.py
      - tools/environments/__init__.py
      - tools/environments/registry.py
      - tools/terminal_tool.py
      - tests/tools/test_environment_registry.py
      - website/docs/developer-guide/plugins/index.md
    tests:
      - scripts/run_tests.sh tests/tools/test_environment_registry.py tests/tools/test_terminal_tool_requirements.py
    retirement: Remove when upstream exposes an equivalent session-stable environment backend registry.

  - id: final-output-policy-context
    kind: core
    rationale: >-
      Give output-policy plugins detached conversation context and the active
      workdir so evidence and workspace footers can remain outside the loop.
    paths:
      - agent/turn_finalizer.py
      - tests/agent/test_transform_llm_output_context.py
      - website/docs/user-guide/features/hooks.md
    tests:
      - scripts/run_tests.sh tests/agent/test_transform_llm_output_context.py
    retirement: Remove when upstream transform_llm_output supplies equivalent read-only context.
